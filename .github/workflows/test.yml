name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: swift test

      - name: Check the translations
        run: python3 -I tools/check-translations.py
