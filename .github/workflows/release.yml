name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: swift test

      - name: Check the translations
        run: python3 -I tools/check-translations.py

      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "No SIGNING_CERTIFICATE secret: the app is signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '$1 ~ /\)$/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "The certificate has no code-signing identity (was it exported with its private key?)" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the zips
        run: tools/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Clipsie-*.zip --title "${GITHUB_REF_NAME#v}" --generate-notes

      - name: Point the cask at the release
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp Casks/clipsie.rb "$RUNNER_TEMP/clipsie.rb"
          git checkout -- .
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          cp "$RUNNER_TEMP/clipsie.rb" Casks/clipsie.rb
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" -c "Set :CFBundleVersion $VERSION" Resources/Info.plist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Clipsie $VERSION"
          git push origin "$BRANCH"
